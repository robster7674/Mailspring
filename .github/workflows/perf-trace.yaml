name: Performance Trace

# On-demand runner for the benchmarks/ harness and tracing spikes (see
# /home/rob/.claude/plans/humming-growing-beacon.md). workflow_dispatch only -
# deliberately not on push/PR, so it doesn't become a required check like
# test.yaml. Reuses test.yaml's xvfb/dbus setup, which is the existing proof
# that this app launches headlessly on a plain ubuntu-22.04 runner via a
# fresh `npm ci` (unlike a dev sandbox with a stale local Electron install).
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Compiled JS entry point to run, relative to benchmarks/dist/'
        required: false
        default: 'spikes/phase0-spike.js'

jobs:
  trace:
    runs-on: ubuntu-22.04

    steps:
      # submodules: recursive matters beyond just getting mailsync's source -
      # scripts/postinstall.js only downloads the prebuilt mailsync binary
      # from S3 when ./mailsync/build.sh is absent. Without the submodule
      # checked out, npm ci hard-fails in CI if no prebuilt binary happens to
      # be published for this exact submodule commit (which is common, since
      # publishing there is a manual release step, not automatic).
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb \
            dbus-x11 \
            libgbm1 \
            libnss3 \
            libasound2 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgtk-3-0

      # First real run got the app loading ("App load time: 2033ms") but a
      # child process was then killed after 15s with no IPC connection
      # established - even with --no-sandbox --disable-gpu on the Electron
      # side. That symptom (main process fine, child process spawns but
      # never completes its connection) matches a known current GitHub
      # Actions runner-image issue: AppArmor restricting unprivileged user
      # namespaces, which blocks Chromium/Electron's child-process spawning
      # regardless of Chromium's own --no-sandbox flag.
      - name: Allow unprivileged user namespaces (Chromium child-process spawning)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile benchmarks/tracing scripts
        run: npm run benchmark:compile

      - name: Run script
        env:
          TRACE_SCRIPT: ${{ github.event.inputs.script }}
        run: dbus-launch --exit-with-session xvfb-run -a node "benchmarks/dist/$TRACE_SCRIPT"
        timeout-minutes: 15

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-trace-results-${{ github.run_id }}
          path: |
            benchmarks/results/**
            benchmarks/dist/results/**
          if-no-files-found: ignore
