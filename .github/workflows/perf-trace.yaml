name: Performance Trace

# On-demand runner for the benchmarks/ harness and tracing spikes (see
# /home/rob/.claude/plans/humming-growing-beacon.md). workflow_dispatch only -
# deliberately not on push/PR, so it doesn't become a required check like
# test.yaml.
#
# Runs on macos-latest, not a Linux runner. Four attempts on ubuntu-22.04 all
# showed the same failure: the main process loads fine, but a child process
# (renderer) is killed 15s in, never having established its IPC connection -
# unaffected by --no-sandbox, --disable-gpu (+friends), --no-zygote, or
# relaxing the AppArmor unprivileged-userns restriction at the runner level.
# GitHub-hosted macOS runners are real VMs, not Linux containers, so they
# sidestep this whole class of namespace-based Chromium sandboxing problem.
# (Also worth knowing: unlike what an earlier version of this comment
# claimed, test.yaml's `npm test` has never actually gotten past `npm ci` in
# any of its visible run history - it wasn't real proof that Electron
# launches headlessly here. Don't cite it as such again without checking.)
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Compiled JS entry point to run, relative to benchmarks/dist/'
        required: false
        default: 'spikes/phase0-spike.js'

jobs:
  trace:
    runs-on: macos-latest

    steps:
      # submodules: recursive matters beyond just getting mailsync's source -
      # scripts/postinstall.js only downloads the prebuilt mailsync binary
      # from S3 when ./mailsync/build.sh is absent. Without the submodule
      # checked out, npm ci hard-fails in CI if no prebuilt binary happens to
      # be published for this exact submodule commit (which is common, since
      # publishing there is a manual release step, not automatic).
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # submodules: recursive avoided the earlier npm-ci S3-download failure,
      # but its side effect is that postinstall.js then skips downloading a
      # prebuilt mailsync binary entirely (since ./mailsync/build.sh now
      # exists) - and we never build one either. The app's own error path
      # for a missing mailsync binary is a *synchronous* dialog.showMessageBoxSync
      # (application.ts ~line 126) waiting for a button click that never
      # comes headlessly - explains every symptom seen so far: process alive,
      # frozen, zero output, no window, CDP evals hanging. The S3-prebuilt
      # path returns 403 for this submodule commit on macOS too (checked
      # directly), so downloading isn't an option - build it for real instead,
      # same as build-linux.yaml does for Linux. build.sh's macOS path is a
      # plain xcodebuild invocation that places the binary directly at
      # app/mailsync where the app expects it.
      # First attempt at this step (see git history) failed after only ~8.5s -
      # far too fast to have actually compiled libetpan/mailcore2/mailsync
      # from scratch, and xcpretty's summary showed no compiler "error:" line
      # at all, just "** BUILD FAILED **". That signature - fast failure, no
      # compile errors reported - matches xcodebuild refusing to sign build
      # products for `-destination 'generic/platform=macOS'` because this
      # runner has no code-signing identity installed (build.sh's comment
      # confirms xcodebuild normally codesigns the products for us). Forcing
      # codesigning off via an xcconfig override (env-var-based, so it
      # doesn't require touching the Mailspring-Sync submodule's build.sh)
      # is the next thing to try - we don't need a signed binary for this CI
      # run, just one that runs long enough to drive the tracing spike.
      - name: Build mailsync (C++ sync engine)
        run: |
          gem install xcpretty
          cat > /tmp/disable-codesign.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          EOF
          export XCODE_XCCONFIG_FILE=/tmp/disable-codesign.xcconfig
          bash mailsync/build.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile benchmarks/tracing scripts
        run: npm run benchmark:compile

      # First macOS run: electron.launch() itself succeeded (unlike every
      # Linux attempt), but firstWindow() then timed out after 90s with the
      # app process alive the whole time and completely silent - not even
      # Electron's own earliest startup logging appeared. That signature
      # (alive, totally silent, indefinite hang) is the standard symptom of
      # Gatekeeper doing a slow/blocked quarantine check on a freshly
      # git-checked-out, unsigned Electron binary.
      - name: Clear macOS quarantine attribute on Electron binary
        run: xattr -cr node_modules/electron/dist/Electron.app || true

      - name: Run script
        env:
          TRACE_SCRIPT: ${{ github.event.inputs.script }}
        run: node "benchmarks/dist/$TRACE_SCRIPT"
        timeout-minutes: 15

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-trace-results-${{ github.run_id }}
          path: |
            benchmarks/results/**
            benchmarks/dist/results/**
          if-no-files-found: ignore
